<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UWS - Unifiable Workspace System</title>
  <link rel="icon" type="image/png" href="/assets/logo.png" />
  <link rel="stylesheet" href="/vendor/xterm/xterm.css" />
  <style>
    :root {
      --bg: #090c10;
      --card-bg: #12161f;
      --card-header: #181d27;
      --border: #2d333b;
      --border-focus: #58a6ff;
      --text: #c9d1d9;
      --text-bold: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-green: #3fb950;
      --accent-yellow: #d29922;
      --accent-red: #f85149;
      --accent-purple: #bc8cff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "JetBrains Mono", "SF Mono", "Fira Code", Consolas, monospace;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    /* TOP STATUS BAR */
    .top-bar {
      height: 40px;
      background: #10141d;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px 0 20px;
      flex-shrink: 0;
      z-index: 5000;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.8px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* QUICK ACTIONS DROPDOWN */
    .actions-dropdown-wrap {
      position: relative;
      display: inline-block;
    }

    .actions-dropdown-trigger {
      background: #1a202c;
      border: 1px solid var(--border);
      color: var(--text-bold);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    .actions-dropdown-trigger:hover {
      background: #283142;
      border-color: var(--accent);
      color: #fff;
    }

    .actions-dropdown-menu {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 5px;
      background: rgba(22, 27, 34, 0.98);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
      min-width: 220px;
      padding: 5px;
      z-index: 10000;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .actions-dropdown-menu.show {
      display: flex;
    }

    .action-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
    }
    .action-menu-item:hover {
      background: #283142;
      color: #fff;
    }
    .action-menu-item.config-btn {
      color: #79c0ff;
      border-top: 1px solid var(--border);
      margin-top: 4px;
      padding-top: 6px;
      font-weight: 600;
    }

    /* MULTI-USER PRESENCE & IDENTITY WIDGET */
    .presence-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141822;
      padding: 3px 6px 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .presence-users-list {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .user-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 14px;
      background: #1f2530;
      color: var(--text);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
    }
    .user-badge:hover {
      border-color: var(--accent);
      color: #fff;
      background: #283142;
    }
    .user-badge.host {
      background: rgba(63, 185, 80, 0.12);
      border-color: rgba(63, 185, 80, 0.35);
      color: #7ee787;
    }
    .user-badge.host:hover {
      background: rgba(63, 185, 80, 0.22);
      border-color: #3fb950;
    }
    .user-badge.editor-now {
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.35);
      border-color: #3fb950;
    }
    .user-badge.you {
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.3);
    }
    .user-badge-name {
      font-weight: 600;
      color: #f0f6fc;
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-badge.host .user-badge-name {
      color: #7ee787;
    }
    .user-badge-tag {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .tag-you {
      background: rgba(88, 166, 255, 0.2);
      color: #79c0ff;
    }
    .tag-editor {
      background: rgba(63, 185, 80, 0.2);
      color: #7ee787;
    }
    .tag-viewer {
      background: rgba(139, 148, 158, 0.18);
      color: #8b949e;
    }
    .user-rename-icon {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 2px;
      transition: color 0.1s;
    }
    .user-badge:hover .user-rename-icon {
      color: #58a6ff;
    }

    .share-btn {
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      font-family: inherit;
      transition: all 0.15s;
    }
    .share-btn:hover {
      background: #2ea043;
      box-shadow: 0 0 8px rgba(46, 160, 67, 0.4);
    }

    .btn-save {
      background: #238636;
      border: 1px solid #2ea043;
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
    }
    .btn-save:hover { background: #2ea043; }

    .btn-cancel {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
    }
    .btn-cancel:hover { background: #30363d; color: #fff; }

    .live-tag {
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-green);
      background: rgba(63, 185, 80, 0.1);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(63, 185, 80, 0.25);
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    /* LEFT HOVER SUMMON MENU */
    .sidebar-dock-trigger {
      position: fixed;
      top: 40px;
      left: 0;
      bottom: 0;
      width: 10px;
      z-index: 99999;
      background: rgba(88, 166, 255, 0.1);
      border-right: 1px solid rgba(88, 166, 255, 0.2);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sidebar-dock-trigger:hover {
      background: rgba(88, 166, 255, 0.3);
    }

    .sidebar-dock {
      position: fixed;
      top: 40px;
      left: 0;
      bottom: 0;
      width: 230px;
      background: rgba(18, 22, 31, 0.98);
      backdrop-filter: blur(16px);
      border-right: 1px solid var(--border);
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.7);
      transform: translateX(-100%);
      transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 100000;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 8px;
    }

    .sidebar-dock-trigger:hover + .sidebar-dock,
    .sidebar-dock:hover {
      transform: translateX(0);
    }

    .dock-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 2px;
      padding-left: 2px;
    }

    .dock-btn {
      width: 100%;
      background: #181d26;
      border: 1px solid var(--border);
      color: var(--text-bold);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
      text-align: left;
    }
    .dock-btn:hover {
      background: #232a38;
      border-color: var(--accent);
      color: #fff;
      transform: translateX(3px);
    }
    .dock-btn:active {
      transform: scale(0.98);
    }

    .dock-btn.btn-accent {
      background: rgba(56, 139, 253, 0.12);
      border-color: rgba(56, 139, 253, 0.3);
      color: #79c0ff;
    }
    .dock-btn.btn-accent:hover {
      background: rgba(56, 139, 253, 0.22);
      border-color: var(--accent);
      color: #fff;
    }

    .dock-btn.btn-purple {
      background: rgba(188, 140, 255, 0.12);
      border-color: rgba(188, 140, 255, 0.3);
      color: #d2a8ff;
    }
    .dock-btn.btn-purple:hover {
      background: rgba(188, 140, 255, 0.22);
      border-color: var(--accent-purple);
      color: #fff;
    }

    /* WORKSPACE ROOT CONTAINER */
    #workspace-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 6px 6px 6px 14px;
      display: flex;
    }

    /* RECURSIVE SPLIT TILING TREE */
    .tiling-split-container {
      display: flex;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      position: relative;
    }

    .tiling-split-container.split-row {
      flex-direction: row;
    }

    .tiling-split-container.split-col {
      flex-direction: column;
    }

    /* SPLITTER GUTTER */
    .split-gutter {
      flex-shrink: 0;
      background: #181d27;
      position: relative;
      z-index: 50;
      transition: background 0.15s;
    }

    .split-gutter.gutter-row {
      width: 6px;
      cursor: col-resize;
      margin: 0 1px;
    }
    .split-gutter.gutter-row:hover,
    .split-gutter.gutter-row.resizing {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.6);
    }

    .split-gutter.gutter-col {
      height: 6px;
      cursor: row-resize;
      margin: 1px 0;
    }
    .split-gutter.gutter-col:hover,
    .split-gutter.gutter-col.resizing {
      background: var(--accent);
      box-shadow: 0 0 8px rgba(88, 166, 255, 0.6);
    }

    /* TILING LEAF PANE */
    .tiling-pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      transition: border-color 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .tiling-pane.active {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(88, 166, 255, 0.25);
    }

    .tiling-pane.dragging {
      opacity: 0.35;
      border-style: dashed;
    }

    /* PANE HEADER */
    .pane-header {
      height: 28px;
      background: var(--card-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 0 10px;
      flex-shrink: 0;
      user-select: none;
      cursor: grab;
    }
    .pane-header:active {
      cursor: grabbing;
    }

    .pane-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      pointer-events: none;
    }

    .pane-title-path {
      color: #79c0ff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pane-actions-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pane-save-btn {
      background: #238636;
      border: 1px solid #2ea043;
      color: #fff;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
    }
    .pane-save-btn:hover {
      background: #2ea043;
    }

    .pane-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      cursor: pointer;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: inherit;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .pane-close-btn:hover {
      color: #fff;
      background: rgba(248, 81, 73, 0.8);
    }

    /* PANE BODY */
    .pane-body {
      flex: 1;
      position: relative;
      background: #0a0d12;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
    }

    /* TERMINAL MOUNT & VIEWER NOTIFICATION BAR */
    .terminal-mount {
      width: 100%;
      height: 100%;
      padding: 4px 6px;
      position: relative;
    }

    .terminal-viewer-notice-wrap {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid rgba(210, 153, 34, 0.6);
      border-radius: 20px;
      padding: 4px 12px;
      display: none;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
      z-index: 1000;
      animation: noticeFadeIn 0.2s ease-out;
    }

    @keyframes noticeFadeIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }

    .terminal-viewer-text {
      font-size: 11px;
      color: #e3b341;
      white-space: nowrap;
    }

    .terminal-viewer-btn {
      background: #d29922;
      border: 1px solid #e3b341;
      color: #111;
      font-weight: 700;
      font-size: 10px;
      padding: 2px 10px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
      white-space: nowrap;
    }
    .terminal-viewer-btn:hover {
      background: #e3b341;
      transform: scale(1.04);
    }

    .terminal-revoke-btn {
      background: rgba(248, 81, 73, 0.2);
      border: 1px solid var(--accent-red);
      color: #ff7b72;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
    }
    .terminal-revoke-btn:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .xterm {
      height: 100%;
      padding: 2px;
    }
    .xterm-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .xterm-viewport::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 3px;
    }

    /* TELEMETRY BODY */
    .telemetry-body {
      padding: 12px 16px;
      overflow-y: auto;
      background: #11151e;
      height: 100%;
    }
    .metric-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      line-height: 1.4;
    }
    .metric-line {
      display: flex;
      align-items: baseline;
    }
    .metric-key {
      font-weight: 700;
      color: var(--text-bold);
      min-width: 80px;
      flex-shrink: 0;
    }
    .metric-val {
      color: #a5d6ff;
      word-break: break-word;
    }
    .metric-val .sub {
      color: var(--text-muted);
      font-size: 10px;
      margin-left: 6px;
    }

    /* FILE EXPLORER UI */
    .explorer-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0d1117;
      overflow: hidden;
    }

    .explorer-nav-bar {
      background: #161b22;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 8px;
      flex-shrink: 0;
    }

    .explorer-drive-chips {
      display: flex;
      align-items: center;
      gap: 5px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .explorer-drive-chips::-webkit-scrollbar {
      height: 3px;
    }
    .explorer-drive-chips::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 2px;
    }

    .drive-chip {
      background: #1f242e;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 2px 7px;
      border-radius: 3px;
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .drive-chip:hover,
    .drive-chip.active {
      background: #283142;
      border-color: var(--accent);
      color: #79c0ff;
    }

    .drive-chip.chip-git {
      background: rgba(188, 140, 255, 0.12);
      border-color: rgba(188, 140, 255, 0.4);
      color: #d2a8ff;
      font-weight: 600;
    }
    .drive-chip.chip-git:hover,
    .drive-chip.chip-git.active {
      background: rgba(188, 140, 255, 0.25);
      border-color: var(--accent-purple);
      color: #fff;
    }

    .explorer-breadcrumb-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      overflow-x: auto;
      white-space: nowrap;
      padding: 2px 0;
    }
    .explorer-breadcrumb-wrap::-webkit-scrollbar {
      height: 3px;
    }
    .explorer-breadcrumb-wrap::-webkit-scrollbar-thumb {
      background: #30363d;
      border-radius: 2px;
    }

    .breadcrumb-pill {
      background: #21262d;
      border: 1px solid var(--border);
      color: #79c0ff;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.12s;
    }
    .breadcrumb-pill:hover {
      background: #30363d;
      border-color: var(--accent);
      color: #fff;
    }
    .breadcrumb-sep {
      color: var(--text-muted);
      font-size: 10px;
    }

    .explorer-toolbar {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .explorer-path-input {
      background: #0a0d12;
      border: 1px solid var(--border);
      color: #fff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      flex: 1;
      min-width: 80px;
    }
    .explorer-path-input:focus {
      border-color: var(--accent);
    }

    .explorer-btn {
      background: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .explorer-btn:hover {
      background: #30363d;
      border-color: var(--accent);
      color: #fff;
    }

    .explorer-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .explorer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s;
    }
    .explorer-item:hover {
      background: #1f242e;
      color: #fff;
    }
    .explorer-item.selected {
      background: rgba(88, 166, 255, 0.18);
      border-left: 2px solid var(--accent);
    }

    .explorer-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .item-badge {
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .badge-folder { background: rgba(88, 166, 255, 0.15); color: #79c0ff; }
    .badge-code { background: rgba(63, 185, 80, 0.15); color: #7ee787; }
    .badge-img { background: rgba(210, 153, 34, 0.15); color: #e3b341; }
    .badge-doc { background: rgba(188, 140, 255, 0.15); color: #d2a8ff; }

    .explorer-footer-bar {
      height: 22px;
      background: #161b22;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* GIT REPOS HUB VIEW */
    .git-hub-container {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      overflow-y: auto;
    }

    .git-hub-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #161b24;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .git-repo-card {
      background: #11151e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.15s;
    }
    .git-repo-card:hover {
      border-color: var(--accent-purple);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .repo-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .repo-title {
      font-size: 13px;
      font-weight: 700;
      color: #d2a8ff;
      display: flex;
      align-items: center;
    }

    .repo-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-branch {
      background: rgba(88, 166, 255, 0.15);
      border: 1px solid rgba(88, 166, 255, 0.3);
      color: #79c0ff;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    .badge-clean {
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid rgba(63, 185, 80, 0.3);
      color: #7ee787;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    .badge-dirty {
      background: rgba(210, 153, 34, 0.15);
      border: 1px solid rgba(210, 153, 34, 0.3);
      color: #e3b341;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
    }

    .repo-commit-info {
      font-size: 11px;
      color: var(--text-muted);
      background: #0d1117;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .repo-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .repo-actions-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* RIGHT-CLICK CONTEXT MENU */
    #uws-context-menu {
      position: fixed;
      display: none;
      background: rgba(22, 27, 34, 0.98);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
      padding: 4px;
      min-width: 190px;
      z-index: 200000;
      font-size: 12px;
      animation: menuFadeIn 0.1s ease-out;
    }

    @keyframes menuFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .context-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 10px;
      border-radius: 4px;
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .context-menu-item:hover {
      background: #283142;
      color: #fff;
    }
    .context-menu-item .menu-hint {
      font-size: 10px;
      color: var(--text-muted);
    }
    .context-menu-item.danger {
      color: #ff7b72;
    }
    .context-menu-item.danger:hover {
      background: rgba(248, 81, 73, 0.2);
      color: #ff7b72;
    }
    .context-menu-sep {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    /* TOAST NOTIFICATION CONTAINER */
    #toast-container {
      position: fixed;
      top: 50px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 999999;
      pointer-events: none;
    }

    .toast-msg {
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: #e6edf3;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastSlideIn 0.25s ease-out, toastFadeOut 0.3s ease-in 3.7s forwards;
      pointer-events: auto;
    }
    .toast-msg.success { border-left: 3px solid var(--accent-green); }
    .toast-msg.info { border-left: 3px solid var(--accent); }
    .toast-msg.warning { border-left: 3px solid var(--accent-yellow); }

    @keyframes toastSlideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes toastFadeOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* MODAL WINDOWS */
    .uws-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 300000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      width: 680px;
      max-width: 90vw;
      max-height: 85vh;
      background: #161b24;
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      height: 42px;
      background: #1c212c;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 700;
      color: #79c0ff;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-footer {
      height: 48px;
      background: #1c212c;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input {
      background: #0d1117;
      border: 1px solid var(--border);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--accent);
    }

    .slot-card {
      background: #11151e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slot-row-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slot-cmd-textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid var(--border);
      color: #7ee787;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      resize: vertical;
      min-height: 48px;
      outline: none;
    }
    .slot-cmd-textarea:focus {
      border-color: var(--accent);
    }

    .tag-chips-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 10px;
    }

    .tag-chip {
      background: rgba(88, 166, 255, 0.12);
      border: 1px solid rgba(88, 166, 255, 0.3);
      color: #79c0ff;
      padding: 1px 6px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.12s;
    }
    .tag-chip:hover {
      background: rgba(88, 166, 255, 0.25);
      border-color: var(--accent);
      color: #fff;
    }

    /* NOTEPAD (TEXT EDITOR) UI */
    .notepad-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #0d1117;
      overflow: hidden;
    }

    .notepad-textarea {
      flex: 1;
      width: 100%;
      background: #0a0d12;
      color: #e6edf3;
      border: none;
      outline: none;
      resize: none;
      padding: 10px 12px;
      font-size: 13px;
      line-height: 1.45;
      font-family: "JetBrains Mono", "SF Mono", Consolas, monospace;
      tab-size: 2;
    }

    .notepad-status-bar {
      height: 22px;
      background: #161b22;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* IMAGE VIEWER UI */
    .image-viewer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 16px;
      background: repeating-conic-gradient(#111620 0% 25%, #161c28 0% 50%) 50% / 20px 20px;
      overflow: auto;
    }

    .image-viewer-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    /* SNAP GHOST & DRAG BADGE */
    #snap-ghost-zone {
      position: absolute;
      display: none;
      background: rgba(56, 139, 253, 0.2);
      border: 2px dashed #58a6ff;
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(88, 166, 255, 0.4), inset 0 0 16px rgba(88, 166, 255, 0.15);
      pointer-events: none;
      z-index: 8000;
      transition: top 0.1s ease, left 0.1s ease, width 0.1s ease, height 0.1s ease;
    }

    #drag-floating-badge {
      position: fixed;
      display: none;
      padding: 6px 12px;
      background: rgba(22, 27, 34, 0.95);
      border: 1px solid var(--accent);
      border-radius: 6px;
      color: #79c0ff;
      font-size: 11px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 100001;
      transform: translate(-50%, -50%);
    }

    .empty-state {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
    }
    .empty-state button {
      background: #238636;
      border: 1px solid #2ea043;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>

      <!-- QUICK ACTIONS DROPDOWN -->

      <!-- MULTI-USER PRESENCE & IDENTITY WIDGET -->

  <!-- LEFT HOVER SUMMON MENU -->

  <!-- CREATE GIT REPO MODAL -->

            💡 Bạn là Host: Tên này sẽ đồng bộ làm Tên hiển thị trong phòng & Tên Node máy trạm.

        </div>

  <!-- SCRIPTS -->
  <script src="/vendor/xterm/xterm.js"></script>
  <script src="/vendor/xterm/addon-fit.js"></script>
  <script src="/vendor/xterm/addon-web-links.js"></script>
  <script>
    let ws = null;
    let currentMachineName = 'UWS-Node';
    let latestMetricsData = null;
    let paneCounter = 0;
    let activePaneId = null;

    // --- USER SESSION & TURN-BASED PERMISSION STATE ---
    let myUserId = null;
    let myUserRole = 'owner';
    let myUserName = '';
    let isHost = true;
    let currentEditorId = null;
    let currentHostId = null;
    let activeUsersList = [];

    // --- AUTOMATION SLOTS STATE ---
    let automationSlots = [];

    // --- GIT REPOSITORIES STATE ---
    let gitReposList = [];

    // --- TOAST NOTIFICATION UTILITY ---
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast-msg ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        if (toast.parentNode) toast.parentNode.removeChild(toast);
      }, 4000);
    }

    function copyShareLink() {
      const shareUrl = window.location.origin;
      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast(`Đã sao chép liên kết chia sẻ: ${shareUrl}`, 'success');
      }).catch(() => {
        prompt('Sao chép liên kết này để chia sẻ cho máy khác:', shareUrl);
      });
    }

    // --- TURN-BASED PERMISSION CONTROLS ---

    function amIEditor() {
      return myUserId && currentEditorId === myUserId;
    }

    function updateTurnControlUI() {
      const isEditor = amIEditor();

      let editorUser = activeUsersList.find(u => u.id === currentEditorId);
      let editorName = editorUser ? editorUser.name : 'Người khác';

      // Update all terminal viewer notice banners
      allLeafsMap.forEach(leaf => {
        if (leaf.serviceType === 'terminal') {
          const noticeWrap = leaf.el.querySelector('.terminal-viewer-notice-wrap');
          const noticeText = leaf.el.querySelector('.terminal-viewer-text');
          const btnRevoke = leaf.el.querySelector('.terminal-revoke-btn');

          if (noticeWrap) {
            if (isEditor) {
              noticeWrap.style.display = 'none';
            } else {
              noticeWrap.style.display = 'inline-flex';
              if (noticeText) {
                noticeText.innerText = `Chế độ Chỉ Xem (Viewer) - [Đang điều khiển: ${editorName}]`;
              }
              if (btnRevoke) {
                btnRevoke.style.display = isHost ? 'inline-block' : 'none';
              }
            }
          }
        }
      });
    }

    function requestEditControl() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'session:request_edit' }));
        showToast('Đã gửi yêu cầu xin quyền điều khiển...', 'info');
      }
    }

    function revokeEditControl() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'session:revoke_edit' }));
        showToast('Đang thu hồi quyền về máy chủ Host...', 'info');
      }
    }

    function grantEditControlToUser(targetUserId, targetUserName) {
      if (confirm(`Bạn có chắc chắn muốn chuyển lượt điều khiển cho "${targetUserName}" không?`)) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'session:grant_edit', targetUserId }));
        }
      }
    }

    function openRenameModal() {
      const modal = document.getElementById('rename-modal');
      const input = document.getElementById('modalRenameInput');
      const hint = document.getElementById('renameModalHint');
      if (!modal || !input) return;

      input.value = myUserName || currentMachineName || '';
      if (isHost) {

    // --- RECURSIVE TILING TREE (VS CODE / TMUX STYLE) ---
    let layoutRoot = null;
    const allLeafsMap = new Map();

    function renderLayoutTree() {
      const container = document.getElementById('workspace-container');
      const ghost = document.getElementById('snap-ghost-zone');

      container.innerHTML = '';
      container.appendChild(ghost);

      if (!layoutRoot) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.innerHTML = `
          <p>Chưa có cửa sổ service nào đang mở</p>
          <button onclick="spawnTerminalPane()">+ Mở PowerShell Terminal</button>
        `;

        return;
      }

      const domTree = buildNodeDOM(layoutRoot);
      container.appendChild(domTree);

      setTimeout(fitAllTerminals, 50);
      updateTurnControlUI();
    }

    function buildNodeDOM(node) {
      if (node.type === 'leaf') {
        node.el.style.flex = '1 1 0%';
        return node.el;
      }

      const container = document.createElement('div');
      container.className = `tiling-split-container split-${node.direction}`;
      container.style.flex = '1 1 0%';

      const firstDOM = buildNodeDOM(node.first);
      const secondDOM = buildNodeDOM(node.second);

      const ratio1 = Math.max(0.1, Math.min(0.9, node.ratio || 0.5));
      const ratio2 = 1 - ratio1;

      firstDOM.style.flex = `${ratio1} ${ratio1} 0%`;
      secondDOM.style.flex = `${ratio2} ${ratio2} 0%`;

      const gutter = document.createElement('div');
      gutter.className = `split-gutter gutter-${node.direction}`;

      setupGutterDragging(gutter, node, firstDOM, secondDOM, container);

      container.appendChild(firstDOM);
      container.appendChild(gutter);
      container.appendChild(secondDOM);

      node.el = container;
      return container;
    }

    function setupGutterDragging(gutter, branchNode, firstDOM, secondDOM, splitContainer) {
      gutter.addEventListener('mousedown', (e) => {
        e.preventDefault();
        e.stopPropagation();

        gutter.classList.add('resizing');

        const isRow = branchNode.direction === 'row';

        function onMouseMove(moveEvent) {
          const rect = splitContainer.getBoundingClientRect();
          const totalSize = isRow ? rect.width : rect.height;
          const curCoord = isRow ? moveEvent.clientX : moveEvent.clientY;
          const offset = curCoord - (isRow ? rect.left : rect.top);

          const newRatio = Math.max(0.1, Math.min(0.9, offset / totalSize));
          branchNode.ratio = newRatio;

          firstDOM.style.flex = `${newRatio} ${newRatio} 0%`;
          secondDOM.style.flex = `${1 - newRatio} ${1 - newRatio} 0%`;
        }

        function onMouseUp() {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          gutter.classList.remove('resizing');
          fitAllTerminals();
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    // --- LEAF PANE CREATION ---

    function createLeafNode({ title, serviceType, icon = '', showSaveBtn = false }) {
      paneCounter++;
      const paneId = `pane_${paneCounter}`;

      const paneEl = document.createElement('div');
      paneEl.className = 'tiling-pane active';
      paneEl.id = paneId;

      paneEl.innerHTML = `
        <div class="pane-header" id="${paneId}_header">
          <div class="pane-title-wrap">
            <span class="pane-title-path" id="${paneId}_title">${title}</span>
          </div>
          <div class="pane-actions-wrap">
            ${showSaveBtn ? `<button class="pane-save-btn" id="${paneId}_saveBtn" onclick="saveNotepad('${paneId}')">Lưu</button>` : ''}
            <button class="pane-close-btn" onclick="closeLeafPane('${paneId}')" title="Đóng cửa sổ">✕</button>
          </div>
        </div>
        <div class="pane-body" id="${paneId}_body"></div>
      `;

      const leafNode = {
        type: 'leaf',
        paneId,
        serviceType,
        title,
        el: paneEl,
        sessionId: null,
      };

      allLeafsMap.set(paneId, leafNode);

      paneEl.addEventListener('mousedown', () => {
        focusLeafPane(paneId);
      });

      const headerEl = paneEl.querySelector('.pane-header');
      setupPaneHeaderDrag(paneId, headerEl);

      const resizeObserver = new ResizeObserver(() => {
        if (leafNode.fitAddon) {
          try {
            leafNode.fitAddon.fit();
            if (leafNode.sessionId && ws && ws.readyState === WebSocket.OPEN && amIEditor()) {
              ws.send(JSON.stringify({
                type: 'terminal:resize',
                sessionId: leafNode.sessionId,
                cols: leafNode.term.cols,
                rows: leafNode.term.rows,
              }));
            }
          } catch (e) {}
        }
      });
      resizeObserver.observe(paneEl);
      leafNode.resizeObserver = resizeObserver;

      return leafNode;
    }

    function addLeafToLayout(newLeaf) {
      if (!layoutRoot) {
        layoutRoot = newLeaf;
      } else {
        let targetNode = allLeafsMap.get(activePaneId);
        if (!targetNode || targetNode === newLeaf) {
          for (const leaf of allLeafsMap.values()) {
            if (leaf !== newLeaf) {
              targetNode = leaf;
              break;
            }
          }
        }

        if (targetNode && targetNode !== newLeaf) {
          const rect = targetNode.el.getBoundingClientRect();
          const direction = (rect.width && rect.height && rect.width < rect.height * 1.1) ? 'col' : 'row';
          splitLeafNode(targetNode, newLeaf, direction, false);
        } else {
          layoutRoot = newLeaf;
        }
      }

      focusLeafPane(newLeaf.paneId);
      renderLayoutTree();
    }

    function splitLeafNode(existingLeaf, newLeaf, direction, newLeafFirst = false) {
      if (layoutRoot === existingLeaf) {
        layoutRoot = {
          type: 'branch',
          direction,
          ratio: 0.5,
          first: newLeafFirst ? newLeaf : existingLeaf,
          second: newLeafFirst ? existingLeaf : newLeaf,
        };
      } else {
        replaceNodeInTree(layoutRoot, existingLeaf, {
          type: 'branch',
          direction,
          ratio: 0.5,
          first: newLeafFirst ? newLeaf : existingLeaf,
          second: newLeafFirst ? existingLeaf : newLeaf,
        });
      }
    }

    function replaceNodeInTree(current, target, replacement) {
      if (current.type === 'branch') {
        if (current.first === target) {
          current.first = replacement;
          return true;
        }
        if (current.second === target) {
          current.second = replacement;
          return true;
        }
        return replaceNodeInTree(current.first, target, replacement) || replaceNodeInTree(current.second, target, replacement);
      }
      return false;
    }

    function closeLeafPane(paneId) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;

      if (leaf.sessionId && ws && ws.readyState === WebSocket.OPEN && amIEditor()) {
        ws.send(JSON.stringify({ type: 'terminal:close', sessionId: leaf.sessionId }));
      }

      if (leaf.resizeObserver) leaf.resizeObserver.disconnect();
      if (leaf.term) leaf.term.dispose();

      allLeafsMap.delete(paneId);

      if (layoutRoot === leaf) {
        layoutRoot = null;
      } else {
        layoutRoot = removeNodeFromTree(layoutRoot, leaf);
      }

      if (activePaneId === paneId) {
        const remaining = Array.from(allLeafsMap.keys());
        activePaneId = remaining.length > 0 ? remaining[0] : null;
      }

      renderLayoutTree();
    }

    function removeNodeFromTree(current, target) {
      if (!current || current.type === 'leaf') return current;

      if (current.first === target) {
        return current.second;
      }
      if (current.second === target) {
        return current.first;
      }

      current.first = removeNodeFromTree(current.first, target);
      current.second = removeNodeFromTree(current.second, target);
      return current;
    }

    function focusLeafPane(paneId) {
      activePaneId = paneId;
      document.querySelectorAll('.tiling-pane').forEach((p) => p.classList.remove('active'));
      const leaf = allLeafsMap.get(paneId);
      if (leaf && leaf.el) {
        leaf.el.classList.add('active');
        if (leaf.term && amIEditor()) leaf.term.focus();
        if (leaf.textarea && amIEditor()) leaf.textarea.focus();
      }
    }

    function fitAllTerminals() {
      allLeafsMap.forEach((leaf) => {
        if (leaf.fitAddon) {
          try {
            leaf.fitAddon.fit();
            if (leaf.sessionId && ws && ws.readyState === WebSocket.OPEN && amIEditor()) {
              ws.send(JSON.stringify({
                type: 'terminal:resize',
                sessionId: leaf.sessionId,
                cols: leaf.term.cols,
                rows: leaf.term.rows,
              }));
            }
          } catch (e) {}
        }
      });
    }

    // --- DRAG & DROP SNAP PREVIEW WITH 4-WAY EDGE DOCKING ---

    function setupPaneHeaderDrag(paneId, headerEl) {
      headerEl.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('pane-close-btn') || e.target.classList.contains('pane-save-btn')) return;
        if (allLeafsMap.size <= 1) return;

        const leafNode = allLeafsMap.get(paneId);
        if (!leafNode) return;

        let isDragging = false;
        const startX = e.clientX;
        const startY = e.clientY;

        const ghost = document.getElementById('snap-ghost-zone');
        const badge = document.getElementById('drag-floating-badge');
        const container = document.getElementById('workspace-container');

        let dropAction = null;

        function onMouseMove(moveEvent) {
          const dist = Math.hypot(moveEvent.clientX - startX, moveEvent.clientY - startY);
          if (!isDragging && dist > 5) {
            isDragging = true;
            leafNode.el.classList.add('dragging');
            badge.style.display = 'block';
            badge.innerText = `Move: ${leafNode.title}`;
            ghost.style.display = 'block';
          }

          if (!isDragging) return;

          badge.style.left = `${moveEvent.clientX + 14}px`;
          badge.style.top = `${moveEvent.clientY + 14}px`;

          const containerRect = container.getBoundingClientRect();
          const mouseX = moveEvent.clientX;
          const mouseY = moveEvent.clientY;

          let hoveredLeaf = null;
          for (const otherLeaf of allLeafsMap.values()) {
            if (otherLeaf.paneId === paneId) continue;
            const r = otherLeaf.el.getBoundingClientRect();
            if (mouseX >= r.left && mouseX <= r.right && mouseY >= r.top && mouseY <= r.bottom) {
              hoveredLeaf = { leaf: otherLeaf, rect: r };
              break;
            }
          }

          if (hoveredLeaf) {
            const r = hoveredLeaf.rect;
            const relX = (mouseX - r.left) / r.width;
            const relY = (mouseY - r.top) / r.height;
            const cLeft = r.left - containerRect.left;
            const cTop = r.top - containerRect.top;

            if (relY < 0.28) {
              ghost.style.left = `${cLeft}px`;
              ghost.style.top = `${cTop}px`;
              ghost.style.width = `${r.width}px`;
              ghost.style.height = `${r.height / 2}px`;
              dropAction = { type: 'split', targetLeaf: hoveredLeaf.leaf, direction: 'col', newLeafFirst: true };
            } else if (relY > 0.72) {
              ghost.style.left = `${cLeft}px`;
              ghost.style.top = `${cTop + r.height / 2}px`;
              ghost.style.width = `${r.width}px`;
              ghost.style.height = `${r.height / 2}px`;
              dropAction = { type: 'split', targetLeaf: hoveredLeaf.leaf, direction: 'col', newLeafFirst: false };
            } else if (relX < 0.35) {
              ghost.style.left = `${cLeft}px`;
              ghost.style.top = `${cTop}px`;
              ghost.style.width = `${r.width / 2}px`;
              ghost.style.height = `${r.height}px`;
              dropAction = { type: 'split', targetLeaf: hoveredLeaf.leaf, direction: 'row', newLeafFirst: true };
            } else if (relX > 0.65) {
              ghost.style.left = `${cLeft + r.width / 2}px`;
              ghost.style.top = `${cTop}px`;
              ghost.style.width = `${r.width / 2}px`;
              ghost.style.height = `${r.height}px`;
              dropAction = { type: 'split', targetLeaf: hoveredLeaf.leaf, direction: 'row', newLeafFirst: false };
            } else {
              ghost.style.left = `${cLeft}px`;
              ghost.style.top = `${cTop}px`;
              ghost.style.width = `${r.width}px`;
              ghost.style.height = `${r.height}px`;
              dropAction = { type: 'swap', targetLeaf: hoveredLeaf.leaf };
            }
          } else {
            ghost.style.display = 'none';
            dropAction = null;
          }
        }

        function onMouseUp() {
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);

          if (isDragging) {
            leafNode.el.classList.remove('dragging');
            ghost.style.display = 'none';
            badge.style.display = 'none';

            if (dropAction) {
              if (dropAction.type === 'swap') {
                swapNodesInTree(layoutRoot, leafNode, dropAction.targetLeaf);
              } else if (dropAction.type === 'split') {
                layoutRoot = removeNodeFromTree(layoutRoot, leafNode);
                splitLeafNode(dropAction.targetLeaf, leafNode, dropAction.direction, dropAction.newLeafFirst);
              }
              renderLayoutTree();
            }
          }
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
        e.preventDefault();
      });
    }

    function swapNodesInTree(root, nodeA, nodeB) {
      function traverse(n) {
        if (!n || n.type === 'leaf') return;
        if (n.first === nodeA) n.first = nodeB;
        else if (n.first === nodeB) n.first = nodeA;

        if (n.second === nodeA) n.second = nodeB;
        else if (n.second === nodeB) n.second = nodeA;

        traverse(n.first);
        traverse(n.second);
      }
      traverse(root);
    }

          red: '#ff7b72',
          green: '#7ee787',
          yellow: '#d29922',
          blue: '#58a6ff',
          magenta: '#bc8cff',
          cyan: '#39c5cf',
          white: '#d1d7e0',
          brightBlack: '#6e7681',
          brightRed: '#ffa198',
          brightGreen: '#56d364',
          brightYellow: '#e3b341',
          brightBlue: '#79c0ff',
          brightMagenta: '#d2a8ff',
          brightCyan: '#56d4dd',

        },
        allowTransparency: true,

      if (window.WebLinksAddon && window.WebLinksAddon.WebLinksAddon) {
        term.loadAddon(new window.WebLinksAddon.WebLinksAddon());

        if (!amIEditor()) {
          showToast('Bạn đang ở chế độ Chỉ Xem. Hãy bấm "Xin Quyền" dưới terminal để gõ lệnh!', 'warning');
          return;
        }
        if (ws && ws.readyState === WebSocket.OPEN && leafNode.sessionId) {
          ws.send(JSON.stringify({
            type: 'terminal:input',
            sessionId: leafNode.sessionId,
            data: data,
          }));
        }
      });

      term.attachCustomKeyEventHandler((e) => {
        if (e.type === 'keydown') {
          if (e.ctrlKey && e.code === 'KeyC' && term.hasSelection()) {
            navigator.clipboard.writeText(term.getSelection()).catch(() => {});
            return false;
          }
          if (e.ctrlKey && e.shiftKey && e.code === 'KeyV') {
            if (!amIEditor()) {
              showToast('Bạn đang ở chế độ Chỉ Xem.', 'warning');
              return false;
            }
            navigator.clipboard.readText().then((text) => {
              if (text && ws && ws.readyState === WebSocket.OPEN && leafNode.sessionId) {
                ws.send(JSON.stringify({ type: 'terminal:input', sessionId: leafNode.sessionId, data: text }));
              }
            }).catch(() => {});
            return false;
          }
        }
        return true;
      });

      if (!existingSessionId && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'terminal:create',
          workspaceId: 'default',
          cwd: customCwd,
          cols: term.cols || 80,
          rows: term.rows || 24,
        }));
      }

      updateTurnControlUI();
      return leafNode;
    }

    // --- CONTEXT MENU SYSTEM ---

    const contextMenuEl = document.getElementById('uws-context-menu');

    function hideContextMenu() {
      if (contextMenuEl) contextMenuEl.style.display = 'none';
      document.querySelectorAll('.explorer-item.selected').forEach(el => el.classList.remove('selected'));
    }

    window.addEventListener('click', (e) => {
      if (!contextMenuEl.contains(e.target)) {
        hideContextMenu();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideContextMenu();
    });

    function showContextMenu(e, items) {
      e.preventDefault();
      e.stopPropagation();

      contextMenuEl.innerHTML = '';

      items.forEach(item => {
        if (item.type === 'separator') {
          const sep = document.createElement('div');
          sep.className = 'context-menu-sep';
          contextMenuEl.appendChild(sep);
        } else {
          const row = document.createElement('div');
          row.className = `context-menu-item ${item.danger ? 'danger' : ''}`;
          row.innerHTML = `
            <span>${item.label}</span>
            ${item.hint ? `<span class="menu-hint">${item.hint}</span>` : ''}
          `;
          row.onclick = () => {
            hideContextMenu();
            item.action();
          };
          contextMenuEl.appendChild(row);
        }
      });

      contextMenuEl.style.display = 'block';

      let x = e.clientX;
      let y = e.clientY;
      const menuWidth = contextMenuEl.offsetWidth || 190;
      const menuHeight = contextMenuEl.offsetHeight || 200;

      if (x + menuWidth > window.innerWidth - 10) {
        x = window.innerWidth - menuWidth - 10;
      }
      if (y + menuHeight > window.innerHeight - 10) {
        y = window.innerHeight - menuHeight - 10;
      }

      contextMenuEl.style.left = `${x}px`;
      contextMenuEl.style.top = `${y}px`;
    }
