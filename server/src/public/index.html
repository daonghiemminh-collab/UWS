    function loadExplorerDirectory(paneId, targetPath = '') {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;
      leaf.currentPath = targetPath;
      leaf.isGitHubView = false;

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'fs:list',
          path: targetPath,
        }));
      }
    }

    function renderExplorerList(paneId, currentPath, parentPath, items, drives) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.el || leaf.isGitHubView) return;

      leaf.currentPath = currentPath;
      leaf.currentParent = parentPath;
      leaf.currentItems = items || [];

      const pathInput = leaf.el.querySelector(`#${paneId}_pathInput`);
      if (pathInput) pathInput.value = currentPath;

      const titleEl = leaf.el.querySelector(`#${paneId}_title`);
      if (titleEl) titleEl.innerText = `Explorer: ${currentPath}`;

      const drivesEl = leaf.el.querySelector(`#${paneId}_drives`);
      if (drivesEl) {
        drivesEl.innerHTML = '';

        const gitChip = document.createElement('span');
        gitChip.className = 'drive-chip chip-git';
        gitChip.innerText = 'Dự Án Git';
        gitChip.onclick = () => openGitReposHubInPane(paneId);
        drivesEl.appendChild(gitChip);

        if (drives && drives.length > 0) {
          drives.forEach((d) => {
            const chip = document.createElement('span');
            chip.className = `drive-chip ${currentPath.startsWith(d.path) ? 'active' : ''}`;
            chip.innerText = d.name;
            chip.onclick = () => loadExplorerDirectory(paneId, d.path);
            drivesEl.appendChild(chip);
          });
        }
      }

      const breadcrumbsEl = leaf.el.querySelector(`#${paneId}_breadcrumbs`);
      if (breadcrumbsEl) {
        breadcrumbsEl.innerHTML = '';
        const normalized = currentPath.replace(/\\/g, '/');
        const parts = normalized.split('/').filter(Boolean);

        let accum = '';
        parts.forEach((p, idx) => {
          accum = (idx === 0 && p.includes(':')) ? `${p}/` : (accum ? `${accum}/${p}` : p);
          const target = accum;
          if (idx > 0) {
            breadcrumbsEl.innerHTML += `<span class="breadcrumb-sep">/</span>`;
          }
          const pill = document.createElement('span');
          pill.className = 'breadcrumb-pill';
          pill.innerText = p;
          pill.onclick = () => loadExplorerDirectory(paneId, target);
          breadcrumbsEl.appendChild(pill);
        });
      }

      applyExplorerFilterAndRender(paneId);
    }

    function explorerFilter(paneId, query) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;
      leaf.searchQuery = (query || '').toLowerCase().trim();
      applyExplorerFilterAndRender(paneId);
    }

    function applyExplorerFilterAndRender(paneId) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.el || leaf.isGitHubView) return;

      const fileList = leaf.el.querySelector(`#${paneId}_fileList`);
      const footer = leaf.el.querySelector(`#${paneId}_footer`);
      if (!fileList) return;

      const q = leaf.searchQuery || '';
      const items = (leaf.currentItems || []).filter(item => {
        if (!q) return true;
        return item.name.toLowerCase().includes(q) || item.extension.toLowerCase().includes(q);
      });

      fileList.innerHTML = '';

      if (items.length === 0) {
        fileList.innerHTML = `
          <div style="padding: 32px; color: var(--text-muted); font-size: 11px; text-align: center;">
            <p style="margin-bottom: 6px;">Thư mục trống</p>
            <span style="font-size: 10px; color: #58a6ff;">(Nhấp chuột phải vào đây để tạo file, folder hoặc mở terminal)</span>
          </div>
        `;
      } else {
        items.forEach((item) => {
          const itemEl = document.createElement('div');
          itemEl.className = 'explorer-item';

          const ext = item.extension.toLowerCase();
          const isImg = ['.png', '.jpg', '.jpeg', '.gif', '.svg', '.webp', '.ico'].includes(ext);
          const isCode = ['.js', '.ts', '.mjs', '.json', '.py', '.html', '.css', '.md', '.txt', '.sh', '.ps1', '.rs', '.go', '.cpp', '.h'].includes(ext);

          let badgeHtml = '<span class="item-badge badge-folder">DIR</span>';

          if (!item.isDirectory) {
            if (isImg) {
              badgeHtml = `<span class="item-badge badge-img">${ext.replace('.', '') || 'IMG'}</span>`;
            } else if (isCode) {
              badgeHtml = `<span class="item-badge badge-code">${ext.replace('.', '') || 'TXT'}</span>`;
            } else {
              badgeHtml = `<span class="item-badge badge-doc">${ext.replace('.', '') || 'FILE'}</span>`;
            }
          }

          const sizeStr = item.isDirectory ? '' : formatBytes(item.sizeBytes);

          itemEl.innerHTML = `
            <div class="explorer-item-left" title="${item.path}">
              ${badgeHtml}
              <span style="font-weight: ${item.isDirectory ? '700' : '400'}; color: ${item.isDirectory ? '#79c0ff' : 'var(--text)'};">${item.name}</span>
              <span style="font-size: 10px; color: var(--text-muted); margin-left: 6px;">${sizeStr}</span>
            </div>
          `;

          itemEl.onclick = () => {
            if (item.isDirectory) {
              loadExplorerDirectory(paneId, item.path);
            } else {
              if (isImg) {
                openFileInImageViewer(item.path);
              } else {
                openFileInNotepad(item.path);
              }
            }
          };

          itemEl.addEventListener('contextmenu', (e) => {
            document.querySelectorAll('.explorer-item.selected').forEach(el => el.classList.remove('selected'));
            itemEl.classList.add('selected');

            const menuActions = [];

            if (!item.isDirectory) {
              menuActions.push({ label: 'Mở trong Notepad', hint: 'Editor', action: () => openFileInNotepad(item.path) });
              if (isImg) {
                menuActions.push({ label: 'Xem ảnh trực quan', hint: 'Viewer', action: () => openFileInImageViewer(item.path) });
              }
            }

            menuActions.push({ label: 'Mở trong Terminal', hint: 'PowerShell', action: () => openItemInTerminal(item.path, item.isDirectory) });

            if (!item.isDirectory) {
              menuActions.push({ label: 'Tải tệp về máy', hint: 'Download', action: () => window.open(`/api/files/download?path=${encodeURIComponent(item.path)}`, '_blank') });
            }

            menuActions.push({ type: 'separator' });
            menuActions.push({ label: 'Đổi tên...', hint: 'F2', action: () => renameExplorerItem(item.path, item.name) });
            menuActions.push({ label: 'Xóa', hint: 'Delete', danger: true, action: () => deleteExplorerItem(item.path) });

            showContextMenu(e, menuActions);
          });

          fileList.appendChild(itemEl);
        });
      }

      if (footer) {
        const dirCount = (leaf.currentItems || []).filter(i => i.isDirectory).length;
        const fileCount = (leaf.currentItems || []).length - dirCount;
        footer.innerHTML = `
          <span>${dirCount} thư mục, ${fileCount} tệp tin</span>
          <span>${leaf.currentPath}</span>
        `;
      }
    }

    function explorerNavigateUp(paneId) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.currentParent) return;
      loadExplorerDirectory(paneId, leaf.currentParent);
    }

    function explorerRefresh(paneId) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;
      if (leaf.isGitHubView) {
        fetchGitRepos();
      } else {
        loadExplorerDirectory(paneId, leaf.currentPath || '');
      }
    }

    function explorerNewFile(paneId) {
      if (!amIEditor()) {
        showToast('Bạn đang ở chế độ Chỉ Xem. Hãy xin quyền trước khi tạo tệp!', 'warning');
        return;
      }
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;
      const name = prompt('Nhập tên tệp mới: (vd: app.js, notes.txt, index.html)');
      if (!name) return;
      const full = leaf.currentPath ? `${leaf.currentPath}/${name}` : name;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'fs:create', path: full, isDir: false }));
      }
    }

    function explorerNewFolder(paneId) {
      if (!amIEditor()) {
        showToast('Bạn đang ở chế độ Chỉ Xem. Hãy xin quyền trước khi tạo thư mục!', 'warning');
        return;
      }
      const leaf = allLeafsMap.get(paneId);
      if (!leaf) return;
      const name = prompt('Nhập tên thư mục mới:');
      if (!name) return;
      const full = leaf.currentPath ? `${leaf.currentPath}/${name}` : name;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'fs:create', path: full, isDir: true }));
      }
    }

    function explorerOpenTerminalHere(paneId) {
      const leaf = allLeafsMap.get(paneId);
      const targetDir = leaf ? leaf.currentPath : undefined;
      spawnTerminalPane(targetDir);
    }

    function openItemInTerminal(itemPath, isDir) {
      let folder = itemPath;
      if (!isDir) {
        const idx = itemPath.lastIndexOf('/');
        folder = idx !== -1 ? itemPath.substring(0, idx) : itemPath;
      }
      spawnTerminalPane(folder);
    }

    function renameExplorerItem(oldPath, curName) {
      if (!amIEditor()) {
        showToast('Bạn đang ở chế độ Chỉ Xem. Hãy xin quyền trước!', 'warning');
        return;
      }
      const newName = prompt(`Đổi tên "${curName}" thành:`, curName);
      if (!newName || newName === curName) return;
      const parts = oldPath.split('/');
      parts.pop();
      parts.push(newName);
      const newPath = parts.join('/');
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'fs:rename', oldPath, newPath }));
      }
    }

    function deleteExplorerItem(itemPath) {
      if (!amIEditor()) {
        showToast('Bạn đang ở chế độ Chỉ Xem. Hãy xin quyền trước!', 'warning');
        return;
      }
      if (confirm(`Bạn có chắc chắn muốn xóa "${itemPath}" không?`)) {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'fs:delete', path: itemPath }));
        }
      }
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    // --- NOTEPAD (DIRECT TEXT/CODE EDITOR) SPAWNING ---

    function spawnNotepadPane(filePath = '') {
      const filename = filePath ? filePath.split('/').pop() : 'Untitled.txt';
      const leafNode = createLeafNode({
        title: `Notepad: ${filename}`,
        serviceType: 'notepad',
        showSaveBtn: true,
      });

      leafNode.filePath = filePath;
      leafNode.isDirty = false;

      addLeafToLayout(leafNode);

      const bodyEl = leafNode.el.querySelector('.pane-body');
      const notepadBox = document.createElement('div');
      notepadBox.className = 'notepad-container';
      notepadBox.innerHTML = `
        <textarea class="notepad-textarea" id="${leafNode.paneId}_textarea" placeholder="Nhập nội dung văn bản hoặc code tại đây... (Ctrl+S để lưu trực tiếp)"></textarea>
        <div class="notepad-status-bar">
          <span id="${leafNode.paneId}_fileInfo">${filePath || 'Tệp mới (Chưa lưu đường dẫn)'}</span>
          <span id="${leafNode.paneId}_cursorInfo">Dòng 1, Cột 1 | UTF-8 | Đã lưu</span>
        </div>
      `;
      bodyEl.appendChild(notepadBox);

      const textarea = leafNode.el.querySelector(`#${leafNode.paneId}_textarea`);
      leafNode.textarea = textarea;

      textarea.addEventListener('input', () => {
        leafNode.isDirty = true;
        updateNotepadStatusBar(leafNode.paneId);
      });

      textarea.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.code === 'KeyS') {
          e.preventDefault();
          saveNotepad(leafNode.paneId);
        }
        if (e.key === 'Tab') {
          e.preventDefault();
          const start = textarea.selectionStart;
          const end = textarea.selectionEnd;
          textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
          textarea.selectionStart = textarea.selectionEnd = start + 2;
          leafNode.isDirty = true;
          updateNotepadStatusBar(leafNode.paneId);
        }
      });

      textarea.addEventListener('keyup', () => updateNotepadStatusBar(leafNode.paneId));
      textarea.addEventListener('click', () => updateNotepadStatusBar(leafNode.paneId));

      if (filePath && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'fs:read', path: filePath }));
      }

      return leafNode;
    }

    function openFileInNotepad(filePath) {
      for (const leaf of allLeafsMap.values()) {
        if (leaf.serviceType === 'notepad' && leaf.filePath === filePath) {
          focusLeafPane(leaf.paneId);
          return;
        }
      }
      spawnNotepadPane(filePath);
    }

    function saveNotepad(paneId) {
      if (!amIEditor()) {
        showToast('Bạn đang ở chế độ Chỉ Xem. Hãy xin quyền trước khi lưu tệp!', 'warning');
        return;
      }

      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.textarea) return;

      let path = leaf.filePath;
      if (!path) {
        path = prompt('Nhập đường dẫn tệp để lưu trực tiếp (vd: E:/UWS/notes.txt, E:/Projects/app.js):', 'E:/UWS/notes.txt');
        if (!path) return;
        leaf.filePath = path;
        const titleEl = leaf.el.querySelector(`#${paneId}_title`);
        if (titleEl) titleEl.innerText = `Notepad: ${path.split('/').pop()}`;
        const fileInfo = leaf.el.querySelector(`#${paneId}_fileInfo`);
        if (fileInfo) fileInfo.innerText = path;
      }

      const content = leaf.textarea.value;
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'fs:write',
          path,
          content,
        }));
      }

      leaf.isDirty = false;
      updateNotepadStatusBar(paneId);
    }

    function updateNotepadStatusBar(paneId) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.textarea) return;

      const cursorInfo = leaf.el.querySelector(`#${paneId}_cursorInfo`);
      if (!cursorInfo) return;

      const val = leaf.textarea.value;
      const pos = leaf.textarea.selectionStart;
      const lines = val.substring(0, pos).split('\n');
      const curLine = lines.length;
      const curCol = lines[lines.length - 1].length + 1;
      const state = leaf.isDirty ? 'Chưa lưu (*)' : 'Đã lưu';

      cursorInfo.innerText = `Dòng ${curLine}, Cột ${curCol} | Ký tự: ${val.length} | UTF-8 | ${state}`;
    }

    // --- IMAGE VIEWER SPAWNING ---

    function spawnImageViewerPane(filePath) {
      const filename = filePath.split('/').pop();
      const leafNode = createLeafNode({
        title: `Image: ${filename}`,
        serviceType: 'image_viewer',
      });

      leafNode.filePath = filePath;
      addLeafToLayout(leafNode);

      const bodyEl = leafNode.el.querySelector('.pane-body');
      const imgBox = document.createElement('div');
      imgBox.className = 'image-viewer-container';
      imgBox.innerHTML = `
        <img src="/api/files/raw?path=${encodeURIComponent(filePath)}" alt="${filename}" />
      `;
      bodyEl.appendChild(imgBox);

      return leafNode;
    }

    function openFileInImageViewer(filePath) {
      for (const leaf of allLeafsMap.values()) {
        if (leaf.serviceType === 'image_viewer' && leaf.filePath === filePath) {
          focusLeafPane(leaf.paneId);
          return;
        }
      }
      spawnImageViewerPane(filePath);
    }

    // --- TELEMETRY PANE SPAWNING ---

    function spawnTelemetryPane() {
      const leafNode = createLeafNode({
        title: 'Telemetry Dashboard',
        serviceType: 'telemetry',
      });

      addLeafToLayout(leafNode);

      const bodyEl = leafNode.el.querySelector('.pane-body');
      const teleBody = document.createElement('div');
      teleBody.className = 'telemetry-body';
      teleBody.innerHTML = `
        <div class="metric-list">
          <div class="metric-line">
            <span class="metric-key">OS:</span>
            <span class="metric-val" id="${leafNode.paneId}_valOs">Đang tải...</span>
          </div>
          <div class="metric-line">
            <span class="metric-key">GPU:</span>
            <span class="metric-val" id="${leafNode.paneId}_valGpu" style="color: #7ee787;">Đang tải...</span>
          </div>
          <div class="metric-line">
            <span class="metric-key">RAM:</span>
            <span class="metric-val" id="${leafNode.paneId}_valRam">Đang tải...</span>
          </div>
          <div class="metric-line">
            <span class="metric-key">Load:</span>
            <span class="metric-val" id="${leafNode.paneId}_valLoad" style="color: #e3b341;">Đang tải...</span>
          </div>
          <div class="metric-line">
            <span class="metric-key">Memory:</span>
            <span class="metric-val" id="${leafNode.paneId}_valMemory">Đang tải...</span>
          </div>
        </div>
      `;
      bodyEl.appendChild(teleBody);

      if (latestMetricsData) {
        renderMetricsForPane(leafNode.paneId, latestMetricsData);
      }

      return leafNode;
    }

    function renderMetricsForPane(paneId, data) {
      const leaf = allLeafsMap.get(paneId);
      if (!leaf || !leaf.el) return;

      const osEl = leaf.el.querySelector(`#${paneId}_valOs`);
      const gpuEl = leaf.el.querySelector(`#${paneId}_valGpu`);
      const ramEl = leaf.el.querySelector(`#${paneId}_valRam`);
      const loadEl = leaf.el.querySelector(`#${paneId}_valLoad`);
      const memEl = leaf.el.querySelector(`#${paneId}_valMemory`);

      if (osEl) osEl.innerText = data.os || 'Windows';
      if (gpuEl) gpuEl.innerText = data.gpu || 'N/A';

      if (ramEl && data.memory) {
        const mem = data.memory;
        ramEl.innerHTML = `<span style="color: #79c0ff;">${mem.usedGB} / ${mem.totalGB} GB</span> <span class="sub">(${mem.usagePercent}% - Trống: ${mem.freeGB} GB)</span>`;
      }

      if (loadEl) loadEl.innerText = data.load || '0%';

      if (memEl && data.disks) {
        const disksStr = data.disks.map(d => `${d.mount} ${d.usagePercent}% (${d.usedGB}/${d.totalGB} GB)`).join('  |  ');
        memEl.innerText = disksStr || 'N/A';
      }
    }

    // --- WEBSOCKET CLIENT ---

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${location.host}/ws`;
      ws = new WebSocket(wsUrl);

      const statusEl = document.getElementById('liveStatus');
      const textEl = document.getElementById('liveStatusText');

      ws.onopen = () => {
        statusEl.style.color = 'var(--accent-green)';
        textEl.innerText = 'Live (1s)';

        const savedName = localStorage.getItem('uws_user_name') || '';
        ws.send(JSON.stringify({
          type: 'session:join',
          workspaceId: 'default',
          userName: savedName,
        }));

        fetchGitRepos();

        if (allLeafsMap.size === 0) {
          spawnTerminalPane();
        }
      };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);

          if (msg.type === 'session:joined') {
            myUserId = msg.yourId;
            myUserRole = msg.yourRole;
            isHost = msg.isHost;
            myUserName = msg.userName;
            localStorage.setItem('uws_user_name', myUserName);

            if (msg.metadata) {
              activeUsersList = msg.metadata.activeUsers || [];
              currentEditorId = msg.metadata.currentEditorId;
              currentHostId = msg.metadata.hostUserId;
              renderPresenceUsers(activeUsersList, currentHostId);
              updateTurnControlUI();
            }
          } else if (msg.type === 'session:users_update') {
            activeUsersList = msg.activeUsers || [];
            currentHostId = msg.hostUserId;
            currentEditorId = msg.currentEditorId;
            renderPresenceUsers(activeUsersList, currentHostId);
            updateTurnControlUI();
          } else if (msg.type === 'session:user_event') {
            if (msg.event === 'join') {
              showToast(`${msg.user.name} vừa tham gia không gian làm việc!`, 'info');
            } else if (msg.event === 'leave') {
              showToast(`${msg.user.name} đã rời khỏi không gian làm việc.`, 'info');
            }
          } else if (msg.type === 'session:edit_requested') {
            if (amIEditor() || isHost) {
              showToast(`${msg.requesterName} đang xin quyền điều khiển!`, 'warning');
              if (confirm(`"${msg.requesterName}" đang xin quyền điều khiển Workspace.\n\nBạn có đồng ý nhượng quyền không?`)) {
                if (ws && ws.readyState === WebSocket.OPEN) {
                  ws.send(JSON.stringify({ type: 'session:grant_edit', targetUserId: msg.requesterId }));
                }
              }
            }
          } else if (msg.type === 'session:edit_granted') {
            currentEditorId = msg.editorId;
            updateTurnControlUI();
            const isMe = msg.editorId === myUserId;
            showToast(isMe ? 'Bạn đã nhận quyền điều khiển Workspace!' : `Quyền điều khiển chuyển cho: ${msg.editorName}`, isMe ? 'success' : 'info');
          } else if (msg.type === 'automation:slots') {
            automationSlots = msg.slots || [];
            renderActionsDropdown(automationSlots);
          } else if (msg.type === 'automation:compiled') {
            runCompiledCommandInTerminal(msg.command, msg.label);
          } else if (msg.type === 'git:list') {
            gitReposList = msg.repos || [];
            allLeafsMap.forEach(leaf => {
              if (leaf.serviceType === 'explorer' && leaf.isGitHubView) {
                updateGitReposDOM(leaf.paneId);
              }
            });
          } else if (msg.type === 'git:action_result') {
            showToast(msg.message, msg.success ? 'success' : 'info');
          } else if (msg.type === 'metrics:update') {
            latestMetricsData = msg.data;
            currentMachineName = msg.data.machineName || 'UWS-Node';

            allLeafsMap.forEach((leafNode) => {
              if (leafNode.serviceType === 'telemetry') {
                renderMetricsForPane(leafNode.paneId, msg.data);
              }
            });
          } else if (msg.type === 'terminal:created') {
            let found = false;
            for (const leafNode of allLeafsMap.values()) {
              if (leafNode.serviceType === 'terminal' && leafNode.sessionId === msg.sessionId) {
                found = true;
                break;
              }
            }

            if (!found) {
              let waitingLeaf = null;
              for (const leafNode of allLeafsMap.values()) {
                if (leafNode.serviceType === 'terminal' && !leafNode.sessionId) {
                  waitingLeaf = leafNode;
                  break;
                }
              }

              if (waitingLeaf) {
                waitingLeaf.sessionId = msg.sessionId;
                waitingLeaf.title = `Terminal: ${msg.cwd || 'storage\\workspaces\\default'}`;
                const titleEl = waitingLeaf.el.querySelector(`#${waitingLeaf.paneId}_title`);
                if (titleEl) titleEl.innerText = waitingLeaf.title;
                if (waitingLeaf.fitAddon) waitingLeaf.fitAddon.fit();
              }
            }
          } else if (msg.type === 'terminal:output') {
            for (const leafNode of allLeafsMap.values()) {
              if (leafNode.sessionId === msg.sessionId && leafNode.term) {
                leafNode.term.write(msg.data);
                break;
              }
            }
          } else if (msg.type === 'terminal:closed') {
            for (const leafNode of allLeafsMap.values()) {
              if (leafNode.sessionId === msg.sessionId) {
                if (leafNode.term) {
                  leafNode.term.write(`\r\n\x1b[33m[Phiên Terminal kết thúc với mã ${msg.exitCode ?? 0}]\x1b[0m\r\n`);
                }
                break;
              }
            }
          } else if (msg.type === 'fs:list') {
            allLeafsMap.forEach((leaf) => {
              if (leaf.serviceType === 'explorer' && !leaf.isGitHubView) {
                renderExplorerList(leaf.paneId, msg.path, msg.parentPath, msg.items, msg.drives);
              }
            });
          } else if (msg.type === 'fs:read') {
            allLeafsMap.forEach((leaf) => {
              if (leaf.serviceType === 'notepad' && leaf.filePath === msg.path && leaf.textarea) {
                leaf.textarea.value = msg.content || '';
                leaf.isDirty = false;
                updateNotepadStatusBar(leaf.paneId);
              }
            });
          } else if (msg.type === 'fs:saved' || msg.type === 'fs:created' || msg.type === 'fs:renamed' || msg.type === 'fs:deleted') {
            allLeafsMap.forEach((leaf) => {
              if (leaf.serviceType === 'explorer' && !leaf.isGitHubView) {
                loadExplorerDirectory(leaf.paneId, leaf.currentPath || '');
              }
            });
          } else if (msg.type === 'error') {
            showToast(msg.message || 'Lỗi hệ thống', 'warning');
          }
        } catch (err) {
          console.error('[WS Parse Error]:', err);
        }
      };

      ws.onclose = () => {
        statusEl.style.color = 'var(--accent-red)';
        textEl.innerText = 'Mất kết nối...';
        setTimeout(connectWS, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    window.addEventListener('resize', () => {
      setTimeout(fitAllTerminals, 100);
    });

    window.addEventListener('DOMContentLoaded', () => {
      connectWS();
    });
  </script>
</body>
