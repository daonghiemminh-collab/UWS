name: Build & Release Meodusa

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

      - name: Package Windows Installers & Portables
        run: npm --workspace=desktop run package:all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            desktop/release/Meodusa-Setup-*.exe
            desktop/release/Meodusa-Portable-*.exe
            desktop/release/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
